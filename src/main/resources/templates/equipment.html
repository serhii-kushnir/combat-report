<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Майно / Склад</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link th:replace="~{fragments :: sidebar-css}">
    <style>
        /* ===== CSS ЗМІННІ ===== */
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --bg-toolbar: #ffffff;
            --bg-table: #ffffff;
            --bg-table-header: #1a237e;
            --bg-input: #ffffff;
            --bg-modal: rgba(0,0,0,0.5);
            --bg-hover: #f5f9ff;
            --bg-confirm: #ffffff;
            --text-primary: #222222;
            --text-secondary: #555555;
            --text-light: #999999;
            --text-white: #ffffff;
            --border-color: #ccc;
            --border-light: #f0f0f0;
            --shadow-color: rgba(0,0,0,0.1);
            --shadow-strong: rgba(0,0,0,0.2);
            --shadow-light: rgba(0,0,0,0.05);
            --toast-success: #2e7d32;
            --toast-error: #c62828;
            --btn-primary-bg: #1565c0;
            --btn-primary-hover: #0d47a1;
            --btn-success-bg: #2e7d32;
            --btn-success-hover: #1b5e20;
            --btn-warning-bg: #e65100;
            --btn-warning-hover: #bf360c;
            --btn-danger-bg: #c62828;
            --btn-danger-hover: #b71c1c;
            --stat-num-color: #1976d2;
            --btn-print: #607d8b;
            --btn-print-hover: #546e7a;
            --btn-history-bg: #6a1b9a;
            --btn-history-hover: #4a148c;
        }

        body.dark-theme {
            --bg-body: #1e1e24;
            --bg-card: #2d2d35;
            --bg-toolbar: #2d2d35;
            --bg-table: #2d2d35;
            --bg-table-header: #2a2a3a;
            --bg-input: #3a3a44;
            --bg-modal: rgba(0,0,0,0.7);
            --bg-hover: #3a3a44;
            --bg-confirm: #2d2d35;
            --text-primary: #e8e8ec;
            --text-secondary: #b0b0b8;
            --text-light: #88888f;
            --text-white: #ffffff;
            --border-color: #3d3d48;
            --border-light: #3d3d48;
            --shadow-color: rgba(0,0,0,0.4);
            --shadow-strong: rgba(0,0,0,0.5);
            --shadow-light: rgba(0,0,0,0.3);
            --btn-primary-bg: #2a4a7a;
            --btn-primary-hover: #3a5a8a;
            --btn-success-bg: #2a4a2a;
            --btn-success-hover: #3a5a3a;
            --btn-warning-bg: #7a5a2a;
            --btn-warning-hover: #8a6a3a;
            --btn-danger-bg: #6a2a3a;
            --btn-danger-hover: #7a3a4a;
            --stat-num-color: #5a8ac5;
            --btn-print: #4a5a6a;
            --btn-print-hover: #5a6a7a;
            --btn-history-bg: #4a1a6a;
            --btn-history-hover: #5a2a7a;
        }

        /* ===== ОСНОВНІ СТИЛІ ===== */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            margin: 0;
        }
        .container { padding: 16px 20px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInRow {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toolbar { animation: fadeIn 0.4s ease forwards; opacity: 0; }
        .stats-row { animation: fadeIn 0.4s ease forwards; opacity: 0; animation-delay: 0.05s; }
        .table-wrap { animation: fadeIn 0.5s ease forwards; opacity: 0; animation-delay: 0.10s; }
        .load-more-container { animation: fadeIn 0.4s ease forwards; opacity: 0; animation-delay: 0.15s; }
        .pagination { animation: fadeIn 0.4s ease forwards; opacity: 0; animation-delay: 0.20s; }

        #tableBody tr {
            animation: fadeInRow 0.3s ease forwards;
            opacity: 0;
        }
        #tableBody tr:nth-child(1) { animation-delay: 0.02s; }
        #tableBody tr:nth-child(2) { animation-delay: 0.04s; }
        #tableBody tr:nth-child(3) { animation-delay: 0.06s; }
        #tableBody tr:nth-child(4) { animation-delay: 0.08s; }
        #tableBody tr:nth-child(5) { animation-delay: 0.10s; }
        #tableBody tr:nth-child(6) { animation-delay: 0.12s; }
        #tableBody tr:nth-child(7) { animation-delay: 0.14s; }
        #tableBody tr:nth-child(8) { animation-delay: 0.16s; }
        #tableBody tr:nth-child(9) { animation-delay: 0.18s; }
        #tableBody tr:nth-child(10) { animation-delay: 0.20s; }
        #tableBody tr:nth-child(11) { animation-delay: 0.22s; }
        #tableBody tr:nth-child(12) { animation-delay: 0.24s; }
        #tableBody tr:nth-child(13) { animation-delay: 0.26s; }
        #tableBody tr:nth-child(14) { animation-delay: 0.28s; }
        #tableBody tr:nth-child(15) { animation-delay: 0.30s; }
        #tableBody tr:nth-child(16) { animation-delay: 0.32s; }
        #tableBody tr:nth-child(17) { animation-delay: 0.34s; }
        #tableBody tr:nth-child(18) { animation-delay: 0.36s; }
        #tableBody tr:nth-child(19) { animation-delay: 0.38s; }
        #tableBody tr:nth-child(20) { animation-delay: 0.40s; }

        /* ===== ТУЛБАР ===== */
        .toolbar {
            background: var(--bg-toolbar);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            box-shadow: 0 1px 4px var(--shadow-color);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .toolbar h2 {
            margin: 0;
            font-size: 18px;
            color: var(--text-primary);
            flex: 1;
        }

        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            line-height: 1.4;
            box-shadow: 0 1px 2px var(--shadow-light);
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px var(--shadow-color);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn i { line-height: 1; }

        .btn-primary { background: var(--btn-primary-bg); color: var(--text-white); }
        .btn-primary:hover { background: var(--btn-primary-hover); }
        .btn-success { background: var(--btn-success-bg); color: var(--text-white); }
        .btn-success:hover { background: var(--btn-success-hover); }
        .btn-warning { background: var(--btn-warning-bg); color: var(--text-white); }
        .btn-warning:hover { background: var(--btn-warning-hover); }
        .btn-danger { background: var(--btn-danger-bg); color: var(--text-white); }
        .btn-danger:hover { background: var(--btn-danger-hover); }
        .btn-history { background: var(--btn-history-bg); color: white; }
        .btn-history:hover { background: var(--btn-history-hover); }
        .btn-sm { padding: 4px 9px; font-size: 11px; }
        .btn-print { background: var(--btn-print); color: white; }
        .btn-print:hover { background: var(--btn-print-hover); }

        select, input[type="text"], input[type="number"] {
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .search-input { width: 220px; }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            width: 100%;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 10px 16px;
            text-align: center;
            box-shadow: 0 1px 4px var(--shadow-color);
            min-width: 100px;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .stat-card .num {
            font-size: 26px;
            font-weight: bold;
            color: var(--stat-num-color);
            transition: color 0.3s;
        }
        .stat-card .lbl {
            font-size: 11px;
            color: var(--text-secondary);
            transition: color 0.3s;
        }

        .table-wrap {
            overflow: auto;
            max-height: 75vh;
            position: relative;
            border-radius: 8px;
            box-shadow: 0 1px 4px var(--shadow-color);
            transition: box-shadow 0.3s;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-table);
            min-width: 1100px;
            transition: background 0.3s;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg-table-header);
            color: var(--text-white);
            transition: background 0.3s;
        }
        th {
            padding: 9px 8px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid var(--bg-table-header);
            transition: background 0.3s;
        }
        th:hover {
            background: var(--bg-hover);
        }
        th.sort-asc::after { content: ' ▲'; font-size: 10px; }
        th.sort-desc::after { content: ' ▼'; font-size: 10px; }

        td {
            padding: 7px 8px;
            font-size: 12px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            vertical-align: middle;
            transition: border-color 0.3s, color 0.3s;
        }
        tr:hover td { background: var(--bg-hover); }

        /* Ширини колонок */
        .col-num { width: 40px; text-align: center; }
        .col-name { width: auto; min-width: 180px; text-align: left; }
        .col-quantity { width: 100px; text-align: center; }
        .col-stock { width: 100px; text-align: center; }
        .col-written { width: 100px; text-align: center; }
        .col-unit { width: 70px; text-align: center; }
        .col-crew { width: 100px; text-align: center; }
        .col-location { width: 100px; text-align: center; }
        .col-category { width: 100px; text-align: center; }
        .col-actions { width: 140px; text-align: center !important; white-space: nowrap; }

        .actions-col { text-align: center; white-space: nowrap; }

        /* ===== БЕЙДЖИКИ ===== */
        .badge-quantity {
            background: #17a2b8;
            color: white;
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            min-width: 50px;
        }
        .badge-stock {
            background: #28a745;
            color: white;
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-written {
            background: #dc3545;
            color: white;
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-unit {
            background: #6f42c1;
            color: white;
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-crew {
            background: #fd7e14;
            color: white;
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-location {
            background: #6f42c1;
            color: white;
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-category {
            background: #20c997;
            color: white;
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-empty {
            background: #6c757d;
            color: white;
            display: inline-block;
            padding: 4px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
        }

        .btn-edit, .btn-delete, .btn-history-small {
            display: inline-block !important;
            margin: 0 2px !important;
            padding: 4px 9px !important;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px var(--shadow-light);
            line-height: 1.4;
        }
        .btn-edit:hover, .btn-delete:hover, .btn-history-small:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px var(--shadow-color);
        }
        .btn-edit:active, .btn-delete:active, .btn-history-small:active {
            transform: translateY(1px);
        }
        .btn-edit { background: #fd7e14; color: white; }
        .btn-edit:hover { background: #e66a0b; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-delete:hover { background: #c82333; }
        .btn-history-small { background: #6a1b9a; color: white; }
        .btn-history-small:hover { background: #4a148c; }

        /* ===== МОДАЛЬНІ ВІКНА ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg-modal);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 24px;
            width: 650px;
            max-width: 96vw;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px var(--shadow-strong);
            transition: background 0.3s, box-shadow 0.3s;
            animation: fadeIn 0.3s ease;
        }
        .modal h2 {
            margin: 0 0 18px;
            font-size: 17px;
            color: var(--text-primary);
            transition: color 0.3s;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group.full { grid-column: 1 / -1; }
        .form-group.wide { grid-column: 1 / -1; }
        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: color 0.3s;
        }
        .form-group input, .form-group select {
            padding: 7px 9px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 18px;
        }

        /* ===== МОДАЛЬНЕ ВІКНО ДЛЯ ІСТОРІЇ ===== */
        .history-modal .modal {
            width: 80vw !important;
            max-width: 1400px !important;
            min-width: 300px !important;
        }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .history-table th {
            background: var(--bg-table-header);
            color: white;
            padding: 8px 10px;
            text-align: left;
            position: sticky;
            top: 0;
        }
        .history-table td {
            padding: 7px 10px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .history-table tr:hover td {
            background: var(--bg-hover);
        }
        .history-table .field-name {
            font-weight: 600;
            color: var(--text-secondary);
        }
        .history-table .old-value {
            color: #c62828;
        }
        .history-table .new-value {
            color: #2e7d32;
        }
        .history-empty {
            text-align: center;
            padding: 30px;
            color: var(--text-light);
        }
        .history-timestamp {
            font-size: 12px;
            color: var(--text-light);
            white-space: nowrap;
        }

        .confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--bg-modal);
            z-index: 1100;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }
        .confirm-overlay.open { display: flex; }
        .confirm-box {
            background: var(--bg-confirm);
            border-radius: 10px;
            padding: 24px;
            width: 340px;
            box-shadow: 0 8px 32px var(--shadow-strong);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .confirm-box p {
            margin: 0 0 16px;
            color: var(--text-primary);
        }
        .confirm-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 18px;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 9999;
        }
        .toast.show { opacity: 1; }
        .toast.ok { background: var(--toast-success); }
        .toast.err { background: var(--toast-error); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
            transition: color 0.3s;
        }

        .pagination {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
        }
        .pagination button {
            padding: 4px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-card);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            color: var(--text-primary);
        }
        .pagination button:hover:not(:disabled) {
            background: var(--bg-hover);
            transform: translateY(-1px);
            box-shadow: 0 2px 6px var(--shadow-color);
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .pagination .page-info {
            font-size: 13px;
            color: var(--text-secondary);
            padding: 4px 8px;
        }

        .load-more-container {
            display: flex;
            justify-content: center;
            margin-top: 14px;
        }
        .load-more-container .btn {
            padding: 6px 18px;
        }

        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .toolbar h2 {
                text-align: center;
            }
            .stats-row {
                flex-direction: column;
                align-items: stretch;
            }
            .stat-card {
                min-width: 80px;
                padding: 8px 12px;
            }
            .stat-card .num {
                font-size: 20px;
            }
            .modal {
                padding: 16px;
                width: 100%;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .table-wrap {
                max-height: 50vh;
            }
            .history-modal .modal {
                width: 95vw !important;
            }
        }

        @media print {
            .sidebar, .toolbar, .stats-row, .no-print, .btn, .btn-print, .btn-success, .btn-primary,
            .pagination, .load-more-container, .modal-overlay, .confirm-overlay {
                display: none !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .main-content {
                margin-left: 0 !important;
                padding: 0 !important;
            }
            .container {
                padding: 10px !important;
                max-width: 100% !important;
            }
            .table-wrap {
                overflow: visible !important;
                box-shadow: none !important;
                border: 1px solid #ccc !important;
                border-radius: 0 !important;
                max-height: none !important;
            }
            table {
                background: white !important;
                width: 100% !important;
            }
            thead {
                background: #1a237e !important;
                color: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            thead th {
                background: #1a237e !important;
                color: white !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            td {
                color: black !important;
                border-bottom: 1px solid #ddd !important;
            }
            tr {
                page-break-inside: avoid;
            }
            .dark-theme td {
                color: black !important;
                background: white !important;
            }
            .dark-theme thead {
                background: #1a237e !important;
                color: white !important;
            }
            .dark-theme thead th {
                background: #1a237e !important;
                color: white !important;
            }
            @page {
                size: landscape;
                margin: 8mm 6mm 8mm 6mm;
            }
        }
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments :: sidebar('equipment')}"></div>
    <div class="main-content">
        <div class="container">
            <div class="toolbar">
                <h2>📦 Облік майна / складу</h2>
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Пошук...">
                <button class="btn btn-success" onclick="openAddModal()">+ Додати позицію</button>
                <button class="btn btn-primary" onclick="exportToXlsx()">📊 Експорт XLSX</button>
                <button class="btn btn-print" onclick="window.print()"><i class="fas fa-print"></i> Друк</button>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="num" id="pageTotal">—</div>
                    <div class="lbl">На сторінці</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="genTotal">—</div>
                    <div class="lbl">Всього в БД</div>
                </div>
            </div>

            <div class="table-wrap">
                <table id="equipmentTable">
                    <thead>
                    <tr>
                        <th class="col-num" data-col="num" onclick="sortBy('num')">№</th>
                        <th class="col-name" data-col="name" onclick="sortBy('name')">Назва</th>
                        <th class="col-quantity" data-col="quantity" onclick="sortBy('quantity')">На позиції</th>
                        <th class="col-stock" data-col="stockQuantity" onclick="sortBy('stockQuantity')">На складі</th>
                        <th class="col-written" data-col="writtenOffQuantity" onclick="sortBy('writtenOffQuantity')">Списано</th>
                        <th class="col-unit" data-col="unit" onclick="sortBy('unit')">Одиниць</th>
                        <th class="col-crew" data-col="crew" onclick="sortBy('crew')">Екіпаж</th>
                        <th class="col-location" data-col="location" onclick="sortBy('location')">Локація</th>
                        <th class="col-category" data-col="category" onclick="sortBy('category')">Категорія</th>
                        <th class="col-actions no-print">Дії</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody">
                    <tr><td colspan="10" class="empty-state">Завантаження...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="load-more-container no-print">
                <button class="btn btn-primary" id="loadMoreBtn" onclick="loadMore()">Завантажити ще</button>
            </div>

            <div class="pagination" id="pagination"></div>
        </div>
    </div>
</div>

<!-- ===== МОДАЛЬНЕ ВІКНО ДОДАВАННЯ/РЕДАГУВАННЯ ===== -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h2 id="modalTitle">➕ Нова позиція</h2>
        <input type="hidden" id="editId">
        <div class="form-grid">
            <div class="form-group full">
                <label>Назва *</label>
                <input type="text" id="eqName" placeholder="Наприклад, Merops (нічний)">
            </div>
            <div class="form-group">
                <label>Кількість на позиції</label>
                <input type="number" id="eqQuantity" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Кількість на складі</label>
                <input type="number" id="eqStockQuantity" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Кількість списано</label>
                <input type="number" id="eqWrittenOffQuantity" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Одиниця виміру</label>
                <input type="text" id="eqUnit" placeholder="шт." value="шт.">
            </div>
            <div class="form-group">
                <label>Екіпаж</label>
                <select id="eqCrew">
                    <option value="">— Не вибрано —</option>
                    <option value="Скопа">Скопа</option>
                    <option value="Шуліка">Шуліка</option>
                </select>
            </div>
            <div class="form-group">
                <label>Локація</label>
                <input type="text" id="eqLocation" placeholder="А0826">
            </div>
            <div class="form-group">
                <label>Категорія</label>
                <input type="text" id="eqCategory" placeholder="Дрони, Боєприпаси...">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal('addModal')" style="background:#eee">Скасувати</button>
            <button class="btn btn-primary" id="saveBtn">Зберегти</button>
        </div>
    </div>
</div>

<!-- ===== МОДАЛЬНЕ ВІКНО ДЛЯ ІСТОРІЇ (80% ширини) ===== -->
<div class="modal-overlay history-modal" id="historyModal">
    <div class="modal">
        <h2><i class="fas fa-history"></i> Історія змін</h2>
        <div id="historyContent" style="max-height: 65vh; overflow-y: auto;">
            <div class="history-empty">Завантаження...</div>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal('historyModal')" style="background:#eee">Закрити</button>
        </div>
    </div>
</div>

<!-- ===== ПІДТВЕРДЖЕННЯ ВИДАЛЕННЯ ===== -->
<div class="confirm-overlay" id="confirmDeleteModal">
    <div class="confirm-box">
        <p>Видалити запис?</p>
        <div class="confirm-actions">
            <button class="btn" onclick="closeModal('confirmDeleteModal')" style="background:#eee">Скасувати</button>
            <button class="btn btn-danger" id="confirmDeleteBtn">Видалити</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script th:replace="~{fragments :: sidebar-js}"></script>
<script>
    // ===== ГЛОБАЛЬНІ ЗМІННІ =====
    let allItems = [];
    let filteredItems = [];
    let sortCol = 'num';
    let sortDir = 1;
    let searchTerm = '';
    let deleteTargetId = null;
    let currentPage = 0;
    let pageSize = 20;
    let totalElements = 0;

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }

    function showToast(msg, type) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    async function loadData() {
        try {
            const res = await fetch(`/equipment/api?page=${currentPage}&size=${pageSize}`);
            if (!res.ok) {
                console.error('Помилка завантаження:', res.status);
                showToast('Помилка завантаження: ' + res.status, 'err');
                return;
            }
            const pageData = await res.json();
            allItems = pageData.content || [];
            totalElements = pageData.totalElements || 0;

            document.getElementById('pageTotal').textContent = allItems.length;
            document.getElementById('genTotal').textContent = totalElements;

            filterAndSort();
            renderPagination();
            updateLoadMoreButton();
        } catch (err) {
            console.error('Network error:', err);
            showToast('Помилка мережі', 'err');
        }
    }

    function filterAndSort() {
        let filtered = allItems;
        if (searchTerm.trim() !== '') {
            const term = searchTerm.trim().toLowerCase();
            filtered = allItems.filter(item =>
                (item.name || '').toLowerCase().includes(term) ||
                (item.crew || '').toLowerCase().includes(term) ||
                (item.location || '').toLowerCase().includes(term) ||
                (item.category || '').toLowerCase().includes(term)
            );
        }
        if (sortCol) {
            filtered = [...filtered].sort((a, b) => {
                let valA, valB;
                if (sortCol === 'num') {
                    valA = a.id;
                    valB = b.id;
                } else if (sortCol === 'name') {
                    valA = (a.name || '').toLowerCase();
                    valB = (b.name || '').toLowerCase();
                } else if (sortCol === 'quantity') {
                    valA = a.quantity || 0;
                    valB = b.quantity || 0;
                } else if (sortCol === 'stockQuantity') {
                    valA = a.stockQuantity || 0;
                    valB = b.stockQuantity || 0;
                } else if (sortCol === 'writtenOffQuantity') {
                    valA = a.writtenOffQuantity || 0;
                    valB = b.writtenOffQuantity || 0;
                } else if (sortCol === 'unit') {
                    valA = (a.unit || '').toLowerCase();
                    valB = (b.unit || '').toLowerCase();
                } else if (sortCol === 'crew') {
                    valA = (a.crew || '').toLowerCase();
                    valB = (b.crew || '').toLowerCase();
                } else if (sortCol === 'location') {
                    valA = (a.location || '').toLowerCase();
                    valB = (b.location || '').toLowerCase();
                } else {
                    valA = (a.category || '').toLowerCase();
                    valB = (b.category || '').toLowerCase();
                }
                if (valA < valB) return -1 * sortDir;
                if (valA > valB) return 1 * sortDir;
                return 0;
            });
        }
        filteredItems = filtered;
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        if (!filteredItems.length) {
            tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Список порожній. Додайте перше майно.</td></tr>';
            return;
        }
        tbody.innerHTML = filteredItems.map((item, idx) => {
            const unitVal = item.unit || 'шт.';
            const unitClass = unitVal ? 'badge-unit' : 'badge-empty';
            const crewVal = item.crew || '';
            const crewClass = crewVal ? 'badge-crew' : 'badge-empty';
            const locVal = item.location || '';
            const locClass = locVal ? 'badge-location' : 'badge-empty';
            const catVal = item.category || '';
            const catClass = catVal ? 'badge-category' : 'badge-empty';
            return `
                <tr>
                    <td class="col-num">${idx + 1}</td>
                    <td class="col-name">${escapeHtml(item.name)}</td>
                    <td class="col-quantity"><span class="badge-quantity" style="cursor:default;">${item.quantity}</span></td>
                    <td class="col-stock"><span class="badge-stock" style="cursor:default;">${item.stockQuantity ?? 0}</span></td>
                    <td class="col-written"><span class="badge-written" style="cursor:default;">${item.writtenOffQuantity ?? 0}</span></td>
                    <td class="col-unit"><span class="${unitClass}" style="cursor:default;">${escapeHtml(unitVal)}</span></td>
                    <td class="col-crew"><span class="${crewClass}" style="cursor:default;">${escapeHtml(crewVal) || '—'}</span></td>
                    <td class="col-location"><span class="${locClass}" style="cursor:default;">${escapeHtml(locVal) || '—'}</span></td>
                    <td class="col-category"><span class="${catClass}" style="cursor:default;">${escapeHtml(catVal) || '—'}</span></td>
                    <td class="col-actions">
                        <button class="btn-history-small no-print" onclick="showHistory(${item.id})" title="Історія змін">📜</button>
                        <button class="btn-edit no-print" onclick="openEditItemModal(${item.id})" title="Редагувати">✏️</button>
                        <button class="btn-delete no-print" onclick="deleteItem(${item.id})" title="Видалити">🗑</button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // ===== ПАГІНАЦІЯ =====
    function goToPage(page) {
        const totalPages = Math.ceil(totalElements / pageSize);
        if (page < 0 || page >= totalPages) return;
        currentPage = page;
        loadData();
    }
    window.goToPage = goToPage;

    function renderPagination() {
        const totalPages = Math.ceil(totalElements / pageSize);
        const pag = document.getElementById('pagination');
        let html = '';
        html += `<button onclick="goToPage(0)" ${currentPage === 0 ? 'disabled' : ''}>⏮</button>`;
        html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 0 ? 'disabled' : ''}>◀</button>`;
        html += `<span class="page-info">Сторінка ${currentPage + 1} з ${totalPages} (всього ${totalElements} записів)</span>`;
        html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>▶</button>`;
        html += `<button onclick="goToPage(${totalPages - 1})" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>⏭</button>`;
        pag.innerHTML = html;
    }

    function updateLoadMoreButton() {
        const totalPages = Math.ceil(totalElements / pageSize);
        const btn = document.getElementById('loadMoreBtn');
        const remaining = totalElements - (currentPage + 1) * pageSize;
        if (remaining <= 0 || totalPages <= 1) {
            btn.disabled = true;
            btn.textContent = 'Всі завантажено';
        } else {
            const nextBatch = Math.min(20, remaining);
            btn.disabled = false;
            btn.textContent = `Завантажити ще ${nextBatch}`;
        }
    }

    function loadMore() {
        const totalPages = Math.ceil(totalElements / pageSize);
        if (currentPage < totalPages - 1) {
            const newSize = Math.min(pageSize + 20, totalElements);
            if (newSize > pageSize) {
                pageSize = newSize;
                currentPage = 0;
                loadData();
            } else {
                showToast('Всі записи вже завантажені', 'ok');
            }
        } else {
            showToast('Всі записи вже завантажені', 'ok');
        }
    }
    window.loadMore = loadMore;

    function sortBy(col) {
        if (sortCol === col) {
            sortDir *= -1;
        } else {
            sortCol = col;
            sortDir = 1;
        }
        document.querySelectorAll('thead th[data-col]').forEach(th => {
            th.classList.remove('sort-asc', 'sort-desc');
            if (th.getAttribute('data-col') === col) {
                th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
            }
        });
        filterAndSort();
    }

    document.getElementById('searchInput').addEventListener('input', function() {
        searchTerm = this.value;
        currentPage = 0;
        loadData();
    });

    // ===== МОДАЛЬНІ ВІКНА (CRUD) =====
    function openAddModal() {
        document.getElementById('modalTitle').textContent = '➕ Нова позиція';
        document.getElementById('editId').value = '';
        document.getElementById('eqName').value = '';
        document.getElementById('eqQuantity').value = '0';
        document.getElementById('eqStockQuantity').value = '0';
        document.getElementById('eqWrittenOffQuantity').value = '0';
        document.getElementById('eqUnit').value = 'шт.';
        document.getElementById('eqCrew').value = '';
        document.getElementById('eqLocation').value = '';
        document.getElementById('eqCategory').value = '';
        openModal('addModal');
    }

    async function addItem() {
        const name = document.getElementById('eqName').value.trim();
        const quantity = parseInt(document.getElementById('eqQuantity').value) || 0;
        const stockQuantity = parseInt(document.getElementById('eqStockQuantity').value) || 0;
        const writtenOffQuantity = parseInt(document.getElementById('eqWrittenOffQuantity').value) || 0;
        const unit = document.getElementById('eqUnit').value.trim() || 'шт.';
        const crew = document.getElementById('eqCrew').value;
        const location = document.getElementById('eqLocation').value.trim();
        const category = document.getElementById('eqCategory').value.trim();
        if (!name) { showToast("Введіть назву", "err"); return; }
        const res = await fetch('/equipment/api', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, quantity, stockQuantity, writtenOffQuantity, unit, crew, location, category })
        });
        if (res.ok) {
            closeModal('addModal');
            currentPage = 0;
            await loadData();
            showToast("Додано", "ok");
        } else {
            const err = await res.text();
            showToast("Помилка: " + err, "err");
        }
    }

    function openEditItemModal(id) {
        const item = allItems.find(i => i.id === id);
        if (!item) return;
        document.getElementById('modalTitle').textContent = '✏️ Редагувати позицію';
        document.getElementById('editId').value = item.id;
        document.getElementById('eqName').value = item.name;
        document.getElementById('eqQuantity').value = item.quantity;
        document.getElementById('eqStockQuantity').value = item.stockQuantity ?? 0;
        document.getElementById('eqWrittenOffQuantity').value = item.writtenOffQuantity ?? 0;
        document.getElementById('eqUnit').value = item.unit || 'шт.';
        document.getElementById('eqCrew').value = item.crew || '';
        document.getElementById('eqLocation').value = item.location || '';
        document.getElementById('eqCategory').value = item.category || '';
        openModal('addModal');
    }

    async function updateFullItem() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('eqName').value.trim();
        const quantity = parseInt(document.getElementById('eqQuantity').value) || 0;
        const stockQuantity = parseInt(document.getElementById('eqStockQuantity').value) || 0;
        const writtenOffQuantity = parseInt(document.getElementById('eqWrittenOffQuantity').value) || 0;
        const unit = document.getElementById('eqUnit').value.trim() || 'шт.';
        const crew = document.getElementById('eqCrew').value;
        const location = document.getElementById('eqLocation').value.trim();
        const category = document.getElementById('eqCategory').value.trim();
        if (!name) { showToast("Назва не може бути порожньою", "err"); return; }
        const res = await fetch(`/equipment/api/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, quantity, stockQuantity, writtenOffQuantity, unit, crew, location, category })
        });
        if (res.ok) {
            closeModal('addModal');
            currentPage = 0;
            await loadData();
            showToast("Оновлено", "ok");
        } else {
            const err = await res.text();
            showToast("Помилка: " + err, "err");
        }
    }

    // ===== НОВА ФУНКЦІЯ: ПОКАЗ ІСТОРІЇ =====
    async function showHistory(id) {
        const modal = document.getElementById('historyModal');
        const content = document.getElementById('historyContent');
        content.innerHTML = '<div class="history-empty">Завантаження...</div>';
        openModal('historyModal');

        try {
            const res = await fetch(`/equipment/api/${id}/history`);
            if (!res.ok) throw new Error('Помилка завантаження');
            const data = await res.json();

            if (!data || data.length === 0) {
                content.innerHTML = '<div class="history-empty">📭 Історія змін відсутня</div>';
                return;
            }

            const formatDate = (ts) => {
                if (!ts) return '—';
                const d = new Date(ts);
                return d.toLocaleDateString('uk-UA') + ' ' + d.toLocaleTimeString('uk-UA', {hour:'2-digit', minute:'2-digit'});
            };

            const fieldMap = {
                'name': 'Назва',
                'quantity': 'Кількість на позиції',
                'stockQuantity': 'Кількість на складі',
                'writtenOffQuantity': 'Кількість списано',
                'unit': 'Одиниця виміру',
                'crew': 'Екіпаж',
                'location': 'Локація',
                'category': 'Категорія'
            };

            let html = `
            <div style="overflow-x:auto;">
            <table class="history-table">
                <thead>
                    <tr>
                        <th style="width:90px;">Час</th>
                        <th style="width:120px;">Поле</th>
                        <th style="min-width:150px;">Нове значення</th>
                        <th style="min-width:150px;">Старе значення</th>
                        <th style="width:100px;">Ким змінено</th>
                    </tr>
                </thead>
                <tbody>
        `;
            data.forEach(h => {
                const fieldLabel = fieldMap[h.fieldName] || h.fieldName;
                html += `
                <tr>
                    <td class="history-timestamp">${formatDate(h.changedAt)}</td>
                    <td class="field-name">${escapeHtml(fieldLabel)}</td>
                    <td class="new-value">${escapeHtml(h.newValue) || '—'}</td>
                    <td class="old-value">${escapeHtml(h.oldValue) || '—'}</td>
                    <td>${escapeHtml(h.changedBy || 'system')}</td>
                </tr>
            `;
            });
            html += `</tbody></table></div>`;
            content.innerHTML = html;

        } catch (err) {
            console.error(err);
            content.innerHTML = '<div class="history-empty">❌ Помилка завантаження історії</div>';
        }
    }

    function deleteItem(id) {
        deleteTargetId = id;
        openModal('confirmDeleteModal');
    }

    document.getElementById('confirmDeleteBtn').onclick = async function() {
        if (!deleteTargetId) return;
        const res = await fetch(`/equipment/api/${deleteTargetId}`, { method: 'DELETE' });
        if (res.ok) {
            closeModal('confirmDeleteModal');
            currentPage = 0;
            await loadData();
            showToast("Видалено", "ok");
        } else {
            const err = await res.text();
            showToast("Помилка: " + err, "err");
        }
        deleteTargetId = null;
    };

    function exportToXlsx() {
        window.location.href = '/equipment/api/export';
    }

    // Кнопка збереження (використовується і для додавання, і для редагування)
    document.getElementById('saveBtn').addEventListener('click', function() {
        const id = document.getElementById('editId').value;
        if (id) {
            updateFullItem();
        } else {
            addItem();
        }
    });

    loadData();
</script>
</body>
</html>
