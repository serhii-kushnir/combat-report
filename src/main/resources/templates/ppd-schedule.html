<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Графік ППД</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link th:replace="~{fragments :: sidebar-css}">
    <style>
        /* ===== CSS ЗМІННІ (ті ж, що в combat-schedule) ===== */
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --bg-toolbar: #ffffff;
            --bg-header: #1a237e;
            --bg-table: #ffffff;
            --bg-hover: #f5f9ff;
            --bg-weekend: #f5f5f5;
            --bg-today: #fffde7;
            --text-primary: #222;
            --text-secondary: #555;
            --text-white: #fff;
            --border-color: #ddd;
            --shadow-color: rgba(0,0,0,0.08);
            --shadow-light: rgba(0,0,0,0.05);
            --btn-nav-bg: #e8eaf6;
            --btn-nav-color: #1a237e;
            --btn-today-bg: #1976d2;
            --btn-today-hover: #1565c0;
            --btn-primary-bg: #1565c0;
            --btn-primary-hover: #0d47a1;
            --btn-success-bg: #2e7d32;
            --btn-success-hover: #1b5e20;
            --btn-print-bg: #607d8b;
            --btn-print-hover: #546e7a;
            --toast-success: #2e7d32;
            --toast-error: #c62828;
            --stat-num-color: #1976d2;
        }
        body.dark-theme {
            /* Аналогічно до combat-schedule */
            --bg-body: #1e1e24;
            --bg-card: #2d2d35;
            --bg-toolbar: #2d2d35;
            --bg-header: #2a2a3a;
            --bg-table: #2d2d35;
            --bg-hover: #3a3a44;
            --bg-weekend: #2a2a35;
            --bg-today: #3a3a30;
            --text-primary: #e8e8ec;
            --text-secondary: #b0b0b8;
            --text-white: #fff;
            --border-color: #3d3d48;
            --shadow-color: rgba(0,0,0,0.4);
            --shadow-light: rgba(0,0,0,0.3);
            --btn-nav-bg: #3a3a4a;
            --btn-nav-color: #90caf9;
            --btn-today-bg: #4a7ab5;
            --btn-today-hover: #5a8ac5;
            --btn-primary-bg: #2a4a7a;
            --btn-primary-hover: #3a5a8a;
            --btn-success-bg: #2a4a2a;
            --btn-success-hover: #3a5a3a;
            --btn-print-bg: #4a5a6a;
            --btn-print-hover: #5a6a7a;
            --stat-num-color: #5a8ac5;
        }

        /* ===== ОСНОВНІ СТИЛІ (аналогічно) ===== */
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }
        .container { padding: 16px 20px; max-width: 100%; overflow-x: auto; }

        /* Анімація */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInRow {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toolbar { animation: fadeIn 0.4s ease forwards; opacity: 0; }
        .table-wrap { animation: fadeIn 0.5s ease forwards; opacity: 0; animation-delay: 0.05s; }
        .legend { animation: fadeIn 0.4s ease forwards; opacity: 0; animation-delay: 0.10s; }
        .stats-container { animation: fadeIn 0.5s ease forwards; opacity: 0; animation-delay: 0.15s; }

        /* Тулбар */
        .toolbar {
            background: var(--bg-toolbar);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            line-height: 1.4;
            box-shadow: 0 1px 2px var(--shadow-light);
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 8px var(--shadow-color); }
        .btn:active { transform: translateY(1px); }
        .btn-nav { background: var(--btn-nav-bg); color: var(--btn-nav-color); }
        .btn-nav:hover { background: var(--btn-nav-hover); }
        .btn-today { background: var(--btn-today-bg); color: white; }
        .btn-today:hover { background: var(--btn-today-hover); }
        .btn-primary { background: var(--btn-primary-bg); color: white; }
        .btn-primary:hover { background: var(--btn-primary-hover); }
        .btn-success { background: var(--btn-success-bg); color: white; }
        .btn-success:hover { background: var(--btn-success-hover); }
        .btn-print { background: var(--btn-print-bg); color: white; }
        .btn-print:hover { background: var(--btn-print-hover); }

        select, input[type="text"] {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            background: var(--bg-input);
            color: var(--text-primary);
            cursor: pointer;
            transition: border-color 0.2s;
            outline: none;
        }
        .current-date {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        /* Таблиця */
        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }
        table {
            border-collapse: collapse;
            background: var(--bg-table);
            min-width: 100%;
            transition: background 0.3s;
        }
        thead tr:first-child th {
            background: var(--bg-header);
            color: var(--text-white);
            font-size: 12px;
            padding: 10px 4px;
            transition: background 0.3s;
        }
        thead tr:last-child th {
            background: var(--bg-header);
            color: #c5cae9;
            font-size: 11px;
            padding: 6px 2px;
        }
        .col-num  { width: 32px; min-width: 32px; }
        .col-rank { width: 125px; min-width: 125px; text-align: left !important; padding-left: 6px !important; }
        .col-name { width: 130px; min-width: 130px; text-align: left !important; padding-left: 8px !important; }
        .col-day  { width: 36px; min-width: 32px; }

        /* Фіксація перших трьох колонок */
        .col-num, .col-rank, .col-name,
        .num-cell, .rank-cell, .name-cell {
            position: sticky;
            z-index: 2;
            background: var(--bg-table);
        }
        thead .col-num, thead .col-rank, thead .col-name { z-index: 3; }
        .col-num, .num-cell { left: 0; }
        .col-rank, .rank-cell { left: 32px; }
        .col-name, .name-cell { left: calc(32px + 125px); }

        td {
            padding: 2px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-primary);
        }
        td.name-cell {
            text-align: left;
            padding: 4px 6px 4px 8px;
            font-size: 12px;
            white-space: nowrap;
        }
        td.rank-cell {
            text-align: left;
            padding: 4px 4px 4px 6px;
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        td.num-cell {
            color: var(--text-light);
            font-size: 11px;
            text-align: center;
        }
        tr:hover td { background: var(--bg-hover); }

        .day-cell {
            cursor: pointer;
            position: relative;
            height: 28px;
            vertical-align: middle;
            padding: 0 !important;
            text-align: center;
            transition: transform 0.2s ease;
        }
        .day-cell:hover { background: var(--bg-hover) !important; transform: translateY(-2px); }
        .day-cell.weekend { background: var(--bg-weekend); }
        .day-cell.today-col { background: var(--bg-today) !important; }

        .cell-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.4;
            background: #1565c0;
            color: white;
        }

        /* Легенда – тільки ППД */
        .legend {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 12px;
            box-shadow: 0 2px 6px var(--shadow-color);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .legend-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-right: 4px;
        }
        .legend-item {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            background: #1565c0;
            color: white;
        }

        /* Статистика */
        .stats-container {
            margin-top: 14px;
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }
        .stats-container h3 {
            font-size: 15px;
            margin: 8px 0 8px 0;
            color: var(--text-primary);
            font-weight: 600;
            padding: 8px 14px 0;
        }
        .stats-table {
            border-collapse: collapse;
            background: var(--bg-table);
            width: 100%;
            font-size: 12px;
            border: 1px solid var(--border-color);
        }
        .stats-table th, .stats-table td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
            text-align: center;
            vertical-align: middle;
        }
        .stats-table td:nth-child(2), .stats-table th:nth-child(2),
        .stats-table td:nth-child(3), .stats-table th:nth-child(3) {
            text-align: left;
            padding-left: 8px;
        }
        .stats-table thead th {
            background: var(--bg-header);
            color: var(--text-white);
            font-size: 12px;
            border: 1px solid var(--bg-header);
        }

        .toast {
            position: fixed; bottom: 20px; right: 20px;
            padding: 10px 18px; border-radius: 8px;
            color: white; font-size: 13px; font-weight: 600;
            opacity: 0; transition: opacity 0.3s;
            z-index: 9999;
        }
        .toast.show { opacity: 1; }
        .toast.ok  { background: var(--toast-success); }
        .toast.err { background: var(--toast-error); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .toolbar { flex-direction: column; align-items: stretch; }
            .col-rank { width: 80px; min-width: 80px; }
            .col-name { width: 90px; min-width: 90px; }
            .col-day { width: 28px; min-width: 28px; }
            .col-num { width: 28px; min-width: 28px; }
            .rank-cell { left: 28px; }
            .name-cell { left: calc(28px + 80px); }
        }

        /* Друк */
        @media print {
            .sidebar, .toolbar, .legend, .no-print, .btn, .btn-print,
            select, input, .status-menu { display: none !important; }
            body { background: white !important; color: black !important; font-size: 7px !important; }
            .main-content { margin-left: 0 !important; padding: 0 !important; }
            .container { padding: 4px !important; max-width: 100% !important; margin: 0 !important; }
            .table-wrap { overflow: visible !important; box-shadow: none !important; border: 1px solid #ccc !important; border-radius: 0 !important; }
            table { background: white !important; width: 100% !important; border-collapse: collapse; font-size: 6px !important; table-layout: fixed !important; }
            .col-num, .num-cell { width: 20px !important; min-width: 20px !important; }
            .col-rank, .rank-cell { width: 40px !important; min-width: 40px !important; }
            .col-name, .name-cell { width: 50px !important; min-width: 50px !important; }
            .col-day { width: 16px !important; min-width: 16px !important; }
            .cell-badge { font-size: 5px !important; padding: 0 2px !important; }
            .stats-container { display: block !important; }
            .stats-table { background: white !important; }
            .stats-table thead th { background: #1a237e !important; color: white !important; }
            .stats-table td { color: black !important; border: 1px solid #ddd !important; }
            .dark-theme td { color: black !important; background: white !important; }
            .dark-theme thead th { background: #1a237e !important; color: white !important; }
            @page { size: landscape; margin: 4mm 3mm; }
        }
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments :: sidebar('ppd-schedule')}"></div>
    <div class="main-content">
        <div class="container">
            <!-- ТУЛБАР -->
            <div class="toolbar">
                <div class="current-date" id="currentDate"></div>
                <button class="btn btn-nav" id="prevBtn">◀</button>
                <button class="btn btn-today" id="todayBtn">Сьогодні</button>
                <button class="btn btn-nav" id="nextBtn">▶</button>
                <h2 id="monthTitle" style="margin:0 10px;">—</h2>
                <select id="yearFilter"><option value="">— Всі роки —</option></select>
                <select id="monthFilter"><option value="">— Всі місяці —</option></select>
                <button class="btn btn-primary" id="applyFilterBtn">Показати</button>
                <button class="btn btn-success" id="exportXlsxBtn">📊 Експорт XLSX</button>
                <button class="btn btn-print" onclick="window.print()">🖨️ Друк</button>
            </div>

            <!-- ГРАФІК -->
            <div class="table-wrap">
                <table id="scheduleTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody">
                    <tr><td colspan="40" style="text-align:center;padding:32px;color:var(--text-light)">Завантаження...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- ЛЕГЕНДА (тільки ППД) -->
            <div class="legend">
                <span class="legend-title">Позначення:</span>
                <span class="legend-item">ППД</span>
                <span style="font-size:11px;color:var(--text-secondary);margin-left:4px;">— день перебування на ППД</span>
            </div>

            <!-- СТАТИСТИКА -->
            <div class="stats-container">
                <h3>📊 Статистика ППД за місяць</h3>
                <div class="table-wrap">
                    <table class="stats-table" id="statsTable">
                        <thead>
                        <tr>
                            <th style="width:32px;">№</th>
                            <th style="width:125px;">Звання</th>
                            <th style="width:130px;">ПІБ</th>
                            <th style="width:60px;">Днів ППД</th>
                        </tr>
                        </thead>
                        <tbody id="statsBody">
                        <tr><td colspan="4" style="text-align:center;color:var(--text-light);">Завантаження...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ПАГІНАЦІЯ (не використовується, але залишаємо для сумісності) -->
            <div class="pagination" id="pagination"></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script th:replace="~{fragments :: sidebar-js}"></script>
<script>
    (function() {
        const UA_MONTHS = ['Січень','Лютий','Березень','Квітень','Травень','Червень',
            'Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
        const UA_DAYS = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];

        let currentYear, currentMonth;
        let tableData = [];
        let statsData = [];

        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth() + 1;

        updateCurrentDate();
        loadFilters();
        loadMonth();

        function updateCurrentDate() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2,'0');
            const month = String(now.getMonth()+1).padStart(2,'0');
            const year = now.getFullYear();
            document.getElementById('currentDate').textContent = `📅 ${day}.${month}.${year}`;
        }

        function loadFilters() {
            fetch('/ppd-schedule/api/years')
                .then(res => res.json())
                .then(years => {
                    const sel = document.getElementById('yearFilter');
                    years.forEach(y => {
                        const opt = document.createElement('option');
                        opt.value = y; opt.textContent = y;
                        sel.appendChild(opt);
                    });
                })
                .catch(() => {});
            fetch('/ppd-schedule/api/months')
                .then(res => res.json())
                .then(months => {
                    const sel = document.getElementById('monthFilter');
                    months.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m; opt.textContent = m;
                        sel.appendChild(opt);
                    });
                })
                .catch(() => {});
        }

        function loadMonth() {
            document.getElementById('monthTitle').textContent =
                UA_MONTHS[currentMonth - 1] + ' ' + currentYear;

            const url = `/ppd-schedule/api?year=${currentYear}&month=${currentMonth}`;
            Promise.all([
                fetch(url),
                fetch(`/ppd-schedule/api/stats?year=${currentYear}&month=${currentMonth}`)
            ])
                .then(responses => Promise.all(responses.map(r => {
                    if (!r.ok) throw new Error('Network error');
                    return r.json();
                })))
                .then(([data, stats]) => {
                    tableData = data;
                    statsData = stats;
                    renderTable();
                    renderStats();
                })
                .catch(err => {
                    console.error(err);
                    showToast('Помилка завантаження даних', 'err');
                    document.getElementById('tableBody').innerHTML =
                        '<tr><td colspan="40" style="text-align:center;padding:32px;color:var(--text-light)">Помилка завантаження</td></tr>';
                    document.getElementById('statsBody').innerHTML =
                        '<tr><td colspan="4" style="text-align:center;color:var(--text-light);">Помилка завантаження статистики</td></tr>';
                });
        }

        // ===== РЕНДЕРИНГ ГРАФІКА =====
        function renderTable() {
            const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

            let headRow1 = `<tr>
                <th class="col-num">№</th>
                <th class="col-rank" style="text-align:left">Звання</th>
                <th class="col-name" style="text-align:left">ПІБ</th>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dow = new Date(currentYear, currentMonth - 1, d).getDay();
                const isWE = (dow === 0 || dow === 6);
                const isTod = (currentYear === today.getFullYear() &&
                    currentMonth === today.getMonth() + 1 &&
                    d === today.getDate());
                headRow1 += `<th class="col-day${isWE ? ' weekend' : ''}${isTod ? ' today-col' : ''}"
                         style="font-size:11px;padding:4px 2px;">${d}</th>`;
            }
            headRow1 += `</tr>`;

            let headRow2 = `<tr><th></th><th></th><th></th>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dow = new Date(currentYear, currentMonth - 1, d).getDay();
                headRow2 += `<th style="font-size:9px;color:#90caf9">${UA_DAYS[dow]}</th>`;
            }
            headRow2 += `</tr>`;
            document.getElementById('tableHead').innerHTML = headRow1 + headRow2;

            if (!tableData || !tableData.length) {
                document.getElementById('tableBody').innerHTML =
                    `<tr><td colspan="${daysInMonth + 3}" style="text-align:center;padding:32px;color:var(--text-light)">Немає даних про особовий склад</td></tr>`;
                return;
            }

            let html = '';
            tableData.forEach((row, idx) => {
                const rowNum = row.personnelNumber ?? (idx + 1);
                let rowHtml = `<tr>
                    <td class="num-cell">${rowNum}</td>
                    <td class="rank-cell">${escapeHtml(row.rank)}</td>
                    <td class="name-cell">${escapeHtml(row.shortName)}</td>`;
                for (let d = 1; d <= daysInMonth; d++) {
                    const status = row.days[d] || '';
                    const dow = new Date(currentYear, currentMonth - 1, d).getDay();
                    const isWE = (dow === 0 || dow === 6);
                    const isTod = (currentYear === today.getFullYear() &&
                        currentMonth === today.getMonth() + 1 &&
                        d === today.getDate());
                    const cls = `day-cell${isWE ? ' weekend' : ''}${isTod ? ' today-col' : ''}`;
                    let badge = '';
                    if (status === 'ППД') {
                        badge = `<span class="cell-badge">ППД</span>`;
                    }
                    rowHtml += `<td class="${cls}" data-pid="${row.id}" data-day="${d}" data-date="${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}" data-status="${status}" onclick="togglePpd(event, this)">${badge}</td>`;
                }
                rowHtml += `</tr>`;
                html += rowHtml;
            });
            document.getElementById('tableBody').innerHTML = html;
        }

        // ===== РЕНДЕРИНГ СТАТИСТИКИ =====
        function renderStats() {
            const tbody = document.getElementById('statsBody');
            if (!statsData || !statsData.length) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-light);">Немає даних для статистики</td></tr>';
                return;
            }
            // Сортуємо за кількістю днів (за бажанням)
            statsData.sort((a, b) => (b.total || 0) - (a.total || 0));

            tbody.innerHTML = statsData.map((row, idx) => {
                const rowNum = row.personnelNumber ?? (idx + 1);
                return `<tr>
                    <td>${rowNum}</td>
                    <td style="text-align:left;">${escapeHtml(row.rank)}</td>
                    <td style="text-align:left;">${escapeHtml(row.shortName)}</td>
                    <td><strong>${row.total ?? 0}</strong></td>
                </tr>`;
            }).join('');
        }

        // ===== КЛІК ПО КОМІРЦІ (вмикає/вимикає ППД) =====
        window.togglePpd = function(event, cell) {
            event.stopPropagation();
            const personnelId = parseInt(cell.dataset.pid);
            const date = cell.dataset.date;
            const currentStatus = cell.dataset.status;

            let newStatus = (currentStatus === 'ППД') ? '' : 'ППД';

            fetch('/ppd-schedule/api/cell', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ personnelId, date, status: newStatus })
            })
                .then(res => {
                    if (!res.ok) throw new Error('Помилка збереження');
                    // Оновлюємо візуально
                    cell.dataset.status = newStatus;
                    if (newStatus === 'ППД') {
                        cell.innerHTML = `<span class="cell-badge">ППД</span>`;
                    } else {
                        cell.innerHTML = '';
                    }
                    // Оновлюємо статистику
                    updateStatsAfterChange(personnelId, date, newStatus);
                })
                .catch(err => {
                    showToast('Помилка: ' + err.message, 'err');
                });
        };

        // ===== ОНОВЛЕННЯ СТАТИСТИКИ ПІСЛЯ ЗМІНИ =====
        function updateStatsAfterChange(personnelId, date, newStatus) {
            // Просто перезавантажуємо статистику з сервера
            fetch(`/ppd-schedule/api/stats?year=${currentYear}&month=${currentMonth}`)
                .then(res => res.json())
                .then(stats => {
                    statsData = stats;
                    renderStats();
                })
                .catch(() => {});
        }

        // ===== НАВІГАЦІЯ =====
        function shiftMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
            loadMonth();
        }

        document.getElementById('prevBtn').onclick = () => shiftMonth(-1);
        document.getElementById('nextBtn').onclick = () => shiftMonth(1);
        document.getElementById('todayBtn').onclick = () => {
            currentYear = today.getFullYear();
            currentMonth = today.getMonth() + 1;
            loadMonth();
        };

        document.getElementById('applyFilterBtn').onclick = () => {
            const yearVal = document.getElementById('yearFilter').value;
            const monthVal = document.getElementById('monthFilter').value;
            if (monthVal) {
                const idx = UA_MONTHS.indexOf(monthVal);
                if (idx !== -1) {
                    currentYear = parseInt(yearVal) || new Date().getFullYear();
                    currentMonth = idx + 1;
                    loadMonth();
                }
            } else if (yearVal) {
                currentYear = parseInt(yearVal);
                currentMonth = 1;
                loadMonth();
            } else {
                currentYear = today.getFullYear();
                currentMonth = today.getMonth() + 1;
                loadMonth();
            }
        };

        // ===== ЕКСПОРТ XLSX =====
        document.getElementById('exportXlsxBtn').onclick = () => {
            const yearVal = document.getElementById('yearFilter').value;
            const monthVal = document.getElementById('monthFilter').value;
            let year = parseInt(yearVal) || currentYear;
            let url = `/ppd-schedule/export?year=${year}`;
            if (monthVal) {
                const idx = UA_MONTHS.indexOf(monthVal);
                if (idx !== -1) {
                    url += `&month=${idx + 1}`;
                }
            }
            window.location.href = url;
        };

        // ===== ДОПОМІЖНІ =====
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
        }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Статистика вимагає окремого ендпоінта – додамо його в контролері нижче
        // Для сумісності поки що використовуємо /api/stats (його потрібно додати)
        // Якщо його немає, завантажуємо статистику з /api (рахуємо на фронті)
        // Але краще додати в контролері метод getStats.
    })();
</script>
</body>
</html>
